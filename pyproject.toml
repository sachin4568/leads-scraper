[project]
name = "lead-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "boto3>=1.37,<2",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.0,<3",
  "openpyxl>=3.1,<4",
  "sentry-sdk[fastapi]>=2.0,<3",
  "httpx>=0.28,<1",
  "psycopg2-binary>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "structlog>=25.1,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.vercel]
entrypoint = "backend.app.main:app"
